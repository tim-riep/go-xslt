name: Release desktop builds

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  # A manual run does everything except publishing the release: it builds,
  # signs and notarizes, and leaves the files as workflow artifacts. Use it to
  # try the macOS signing without cutting a tag.
  workflow_dispatch:

# The token gets read access to the repository only; a job that needs more
# says so itself.
permissions:
  contents: read

# The wails3 CLI version is pinned to match desktop/go.mod's
# github.com/wailsapp/wails/v3 require line, so the CLI's task/bindings
# glue never drifts out of sync with the library the app actually imports.
env:
  WAILS3_VERSION: v3.0.0-alpha2.103
  NODE_VERSION: '22'

jobs:
  test:
    name: Test library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-go's go-version-file reads only the `go` directive (the minimum
      # for library users, 1.25.0), not the `toolchain` line, so it installed
      # 1.25.0 and only commands run inside the module switched to the
      # toolchain's Go (GOTOOLCHAIN=auto). Tools built outside the module
      # (the wails3 CLI, govulncheck) were compiled with 1.25.0 and then
      # analysed code whose standard library is 1.26.x: "file requires newer
      # Go version go1.26 (application built with go1.25)". So install the
      # toolchain line's version; go.mod stays the single source for it.
      - name: Read the Go version from the toolchain line
        id: gover
        shell: bash
        run: |
          v=$(sed -n 's/^toolchain go//p' go.mod)
          test -n "$v" || { echo "no toolchain line in go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # One job per macOS architecture, so the two builds and — the long part —
  # the two Apple notarizations run side by side instead of one after the other.
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: test
    runs-on: macos-latest
    # Apple's notary service can take an hour or more for a new developer
    # account; the wait below is bounded well inside this.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    env:
      # Without the signing secrets (a fork, say) the bundle stays ad-hoc
      # signed, as before.
      SIGN_MACOS: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      APP: go-xslt-darwin-${{ matrix.arch }}.app
    steps:
      - uses: actions/checkout@v4

      - name: Read the Go version from the toolchain line
        id: gover
        shell: bash
        run: |
          v=$(sed -n 's/^toolchain go//p' desktop/go.mod)
          test -n "$v" || { echo "no toolchain line in desktop/go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}
          # setup-go's own cache is keyed by go.sum alone, so both matrix jobs
          # share one entry and only one architecture's objects end up in it
          # (the other, the cross-compiled one, rebuilt everything every time).
          cache: false

      - name: Cache the Go build and module caches (per architecture)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('desktop/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.arch }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Cache the wails3 CLI
        id: wails3
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-go${{ steps.gover.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS3_VERSION }}

      - name: Install wails3 CLI
        if: steps.wails3.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      # The tag (v0.1.5 -> 0.1.5) goes into the bundle's Info.plist, which the
      # macOS "About go-xslt" panel shows; a manual run gets 0.0.0-<sha>.
      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # Both archs build natively (Xcode's clang cross-targets Apple Silicon
      # and Intel from either host arch).
      - name: Build macOS (${{ matrix.arch }})
        working-directory: desktop
        run: make build-mac-${{ matrix.arch }}

      # --- Developer ID signing, notarization, stapling ----------------------
      # The certificate lives in a throwaway keychain that is deleted at the
      # end. Apple's "Developer ID G2" intermediate certificate has to be in
      # it too, or the identity does not count as valid; it is pinned by its
      # SHA-256 fingerprint.
      - name: Import the Developer ID certificate
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          FP="$(openssl x509 -inform der -in "$RUNNER_TEMP/DeveloperIDG2CA.cer" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$FP" = "F1:6C:D3:C5:4C:7F:83:CE:A4:BF:1A:3E:6A:08:19:C8:AA:A8:E4:A1:52:8F:D1:44:71:5F:35:06:43:D2:DF:3A" \
            || { echo "unexpected Developer ID G2 certificate: $FP"; exit 1; }
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY" || { echo "no valid Developer ID Application identity in the keychain"; exit 1; }
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign the .app bundle
        if: env.SIGN_MACOS == 'true'
        working-directory: desktop/build/bin
        run: |
          set -euo pipefail
          codesign --force --deep --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Anything but "Accepted" fails the job (with Apple's log), and so the
      # release is never published. notarytool logs in with an App Store
      # Connect API key (Team Key, role Developer).
      - name: Notarize the .app bundle
        if: env.SIGN_MACOS == 'true'
        working-directory: desktop/build/bin
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # The credentials go straight to notarytool (the values are masked in
          # the log). `store-credentials` into the throwaway keychain crashed
          # notarytool on the runner.
          for v in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!v}" || { echo "secret $v is not set"; exit 1; }
          done
          KEYFILE="$RUNNER_TEMP/AuthKey_${{ matrix.arch }}.p8"
          (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$KEYFILE")
          trap 'rm -f "$KEYFILE"' EXIT
          AUTH=(--key "$KEYFILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          ditto -c -k --keepParent "$APP" notarize.zip
          id="$(xcrun notarytool submit notarize.zip "${AUTH[@]}" --output-format json | jq -r .id)"
          echo "submitted ${{ matrix.arch }}: $id"
          xcrun notarytool wait "$id" "${AUTH[@]}" --timeout 3h > /dev/null || true
          status="$(xcrun notarytool info "$id" "${AUTH[@]}" --output-format json | jq -r .status)"
          echo "${{ matrix.arch }}: $status"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" "${AUTH[@]}" || true
            exit 1
          fi
          rm -f notarize.zip

      - name: Staple the notarization ticket
        if: env.SIGN_MACOS == 'true'
        working-directory: desktop/build/bin
        run: |
          set -euo pipefail
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Remove the signing keychain
        if: always() && env.SIGN_MACOS == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # A directory isn't a valid single-file release asset, so zip the .app
      # (signed and notarized above, ad-hoc signed without the secrets) before
      # upload. -y preserves the bundle's symlinks.
      - name: Zip the macOS .app bundle
        working-directory: desktop/build/bin
        run: zip -r -y "$APP.zip" "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: desktop/build/bin/go-xslt-darwin-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  # Windows is pure Go (CGO_ENABLED=0, no Windows toolchain needed), so it
  # cross-compiles on a cheap Linux runner.
  build-windows:
    name: Build Windows
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the Go version from the toolchain line
        id: gover
        shell: bash
        run: |
          v=$(sed -n 's/^toolchain go//p' desktop/go.mod)
          test -n "$v" || { echo "no toolchain line in desktop/go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # The CLI also builds without CGo (a static binary), so this job needs
      # none of the GTK/WebKitGTK libraries the Linux job installs. The cache
      # key differs from the Linux job's, whose binary is linked against them.
      - name: Cache the wails3 CLI
        id: wails3
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-nocgo-go${{ steps.gover.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS3_VERSION }}

      - name: Install wails3 CLI
        if: steps.wails3.outputs.cache-hit != 'true'
        env:
          CGO_ENABLED: '0'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # The version shown in the exe's file properties (Details tab).
      - name: Stamp the version into the Windows version info
        working-directory: desktop
        run: |
          NUMERIC="$(printf '%s' "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+)*' || echo 0.0.0)"
          sed -i "s/\"file_version\": \"[^\"]*\"/\"file_version\": \"$NUMERIC\"/; s/\"ProductVersion\": \"[^\"]*\"/\"ProductVersion\": \"$VERSION\"/" build/windows/info.json
          grep -E 'file_version|ProductVersion' build/windows/info.json

      - name: Build Windows (amd64 + arm64)
        working-directory: desktop
        run: make build-win

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktop/build/bin/go-xslt-windows-amd64.exe
            desktop/build/bin/go-xslt-windows-arm64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the Go version from the toolchain line
        id: gover
        shell: bash
        run: |
          v=$(sed -n 's/^toolchain go//p' desktop/go.mod)
          test -n "$v" || { echo "no toolchain line in desktop/go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Linux needs real CGo (GTK4 + WebKitGTK 6.0 — Wails v3's default,
      # non-legacy Linux stack per its own internal/doctor/packagemanager/
      # apt.go; the older libgtk-3-dev/libwebkit2gtk-4.1-dev pair is only
      # for a build opting into `-tags gtk3`, which this one doesn't).
      # Installing these lets wails3's own build:native task run directly
      # on this runner instead of falling back to the ~800MB wails-cross
      # Docker image.
      # A hanging package mirror once kept this step running for good; the
      # timeout makes it fail instead ("Re-run failed jobs" then retries it).
      - name: Install Linux GUI build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Cache the wails3 CLI
        id: wails3
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-go${{ steps.gover.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS3_VERSION }}

      - name: Install wails3 CLI
        if: steps.wails3.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Build Linux (amd64)
        working-directory: desktop
        run: make build-linux

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/build/bin/go-xslt-linux-amd64
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-macos, build-windows, build-linux]
    # A manual run (workflow_dispatch) only leaves artifacts behind.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release and uploads its files
    steps:
      # Only for the release notes: docs/release-notes/<tag>.md, when present.
      # Also the license files that go next to the binaries.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/release-notes
            LICENSE
            NOTICE
            THIRD-PARTY-LICENSES.md
          sparse-checkout-cone-mode: false

      # The hand-written notes (when present) followed by the license line,
      # in one file: body_path wins over body, so the line cannot be a second
      # input. GitHub's generated list comes after both.
      - name: Release body
        id: notes
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          : > release-body.md
          if [ -f "$f" ]; then cat "$f" >> release-body.md; printf '\n' >> release-body.md; else echo "no $f; GitHub's generated notes only"; fi
          printf 'Licensed under the Apache License 2.0 (`LICENSE`). Third-party licenses: `THIRD-PARTY-LICENSES.md` (`NOTICE` summarises them); both are attached.\n' >> release-body.md
          echo "path=release-body.md" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into one release directory
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          # go-xslt-darwin-arm64.app.zip -> go-xslt-v0.1.5-darwin-arm64.app.zip
          for f in release/go-xslt-*; do
            b="$(basename "$f")"
            mv "$f" "release/go-xslt-${GITHUB_REF_NAME}-${b#go-xslt-}"
          done
          # Not go-xslt-*, so the renaming loop above leaves them alone.
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md release/
          ls -la release

      # A DRAFT: the Windows executables are signed afterwards on a maintainer's
      # machine (scripts/sign-windows.sh, Certum SimplySign), which then
      # publishes the release. Drafts are invisible to users and to the
      # desktop app's update check.
      - name: Create/update the GitHub release for this tag (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release/*
          # The hand-written notes and the license line come first (one file,
          # see "Release body"), GitHub's generated list after.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          draft: true
