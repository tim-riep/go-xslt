name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token gets read access to the repository only; a job that needs more
# says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Build, vet, test (library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-go's go-version-file reads only the `go` directive (the minimum
      # for library users, 1.25.0), not the `toolchain` line, so it installed
      # 1.25.0 and only commands run inside the module switched to the
      # toolchain's Go (GOTOOLCHAIN=auto). Tools built outside the module
      # (the wails3 CLI, govulncheck) were compiled with 1.25.0 and then
      # analysed code whose standard library is 1.26.x: "file requires newer
      # Go version go1.26 (application built with go1.25)". So install the
      # toolchain line's version; go.mod stays the single source for it.
      - name: Read the Go version from the toolchain line
        id: gover
        shell: bash
        run: |
          v=$(sed -n 's/^toolchain go//p' go.mod)
          test -n "$v" || { echo "no toolchain line in go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Known vulnerabilities in the Go toolchain (go.mod's toolchain line) and
      # in golang.org/x/text that our code actually reaches; a new advisory
      # turns the build red instead of going unnoticed in shipped binaries.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    # The desktop GUI's TypeScript is type-checked against the GENERATED Wails
    # bindings. A changed engine struct without `make bindings` only broke the
    # release build (v0.0.9/v0.0.10) — catch it on every push instead.
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: npm ci
        working-directory: desktop/frontend
        run: npm ci

      - name: tsc + vite build
        working-directory: desktop/frontend
        run: npm run build

  licenses:
    # One source of truth for third-party licenses (scripts/licenses): fails
    # when a dependency that ships is not documented, has no recognisable or
    # an unlisted license, or when NOTICE, THIRD-PARTY-LICENSES.md and
    # desktop/licenses are stale. The Go side only needs `go list` (no cgo,
    # GTK or pkg-config); the npm side reads the license files in node_modules.
    name: Licenses (documented and up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the Go version from the toolchain line
        id: gover
        shell: bash
        run: |
          v=$(sed -n 's/^toolchain go//p' go.mod)
          test -n "$v" || { echo "no toolchain line in go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: npm ci
        working-directory: desktop/frontend
        run: npm ci

      - name: go test (matcher, lockfile parser)
        run: go test ./scripts/licenses

      - name: Licenses are documented and up to date
        run: go run ./scripts/licenses -check

  windows:
    # Filesystem-relative resolution (BaseDir, file: URIs) is OS-specific, so the
    # Linux job cannot see regressions in it (issue #1). Run the targeted tests
    # on a real Windows runner; the full conformance suites stay on Linux.
    name: Windows (file URIs, BaseDir-relative resolution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the Go version from the toolchain line
        id: gover
        shell: bash
        run: |
          v=$(sed -n 's/^toolchain go//p' go.mod)
          test -n "$v" || { echo "no toolchain line in go.mod" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}

      - name: go build
        run: go build ./...

      - name: go test (file URI handling)
        run: go test ./internal/fileuri ./engine
